// CONTACT_GUIDED_CABLE
// 


 ATTRIBUTES(COMMON) 
 
 {
  
  // Initial and reference densities
  KEYWORD_STR                     = VALUE(STRING, "Solver Keyword");
  IdOption                        = VALUE(INT, "IDOption");
  LSDYNA_SOFT                     = VALUE(INT, "Flag for soft constraint option");
  LSDYNA_SSFAC                    = VALUE(FLOAT, "Stiffness scale factor for penalty stiffness value");
  LSDYNA_FRIC                     = VALUE(FLOAT, "Contact friction");

  LSDYNA_NSID                     = VALUE(SETS,  "*SET_NODE ID") { SUBTYPES = (/SETS/SET_NODE_IDPOOL ) ; }
  IO_FLAG                         = VALUE(INT, "Import/Export flag");
  LSDYNA_PID                      = VALUE(COMPONENT, "*PART ID");
  LSDYNA_PSID                     = VALUE(SETS,  "*SET_PART ID") { SUBTYPES = (/SETS/SET_PART_IDPOOL ) ; }
  PID_TYP                         = VALUE(INT,   "Flag for PID type");
  Type                            = VALUE(STRING, "");
  TITLE                           = VALUE(STRING,"");
}

DEFAULTS(COMMON)
{
    LSDYNA_SSFAC            = 1.0;
}

SKEYWORDS_IDENTIFIER(COMMON)

{

 KEYWORD_STR                 = 9000;
 IdOption                    = 8113;
 LSDYNA_SOFT                 = 22;
 LSDYNA_SSFAC                = 7899;
 LSDYNA_FRIC                 = 59;

 IO_FLAG                     = -1;
 PID_TYP                     = -1;
 TITLE                       = -1;
}


GUI(COMMON) 

{
    ASSIGN(KEYWORD_STR, "*CONTACT_GUIDED_CABLE");

    RADIO(PID_TYP)
    {
       ADD(0, "Part ID");
       ADD(1, "Part Set ID");
    }
    if(PID_TYP == 0)
    {
        DATA(LSDYNA_PID);
    }
    else
    {
        DATA(LSDYNA_PSID);
    }
    DATA(LSDYNA_NSID);



    FLAG(IdOption);
    if(IdOption == TRUE)
    {
        ASSIGN(KEYWORD_STR, "_ID");
    }
    RADIO(LSDYNA_SOFT)
    {
        ADD(0, "0: Penalty formulation");
        ADD(1, "1: Soft constraint formulation");
    }
    SCALAR(LSDYNA_SSFAC);
    SCALAR(LSDYNA_FRIC);
}

// File format
FORMAT(Keyword971) {
//
COMMENT("$     NSID  PID/PSID      SOFT     SSFAC      FRIC");
CARD("                    %10d%10lg%10lg",LSDYNA_SOFT,LSDYNA_SSFAC,LSDYNA_FRIC);
}

FORMAT(Keyword971_R15.0) {

    ASSIGN(IO_FLAG, 1, IMPORT);
    ASSIGN(IO_FLAG, 0, EXPORT);

    if (IO_FLAG == 0)
    {
        if(PID_TYP == 0 && IdOption == 0)
        {
            HEADER("*CONTACT_GUIDED_CABLE");
        }
        else if(PID_TYP == 0 && IdOption == 1)
        {
            HEADER("*CONTACT_GUIDED_CABLE_ID");
        }
        else if(PID_TYP == 1 && IdOption == 0)
        {
            HEADER("*CONTACT_GUIDED_CABLE_SET");
        }
        else if(PID_TYP == 1 && IdOption == 1)
        {
            HEADER("*CONTACT_GUIDED_CABLE_SET_ID");
        }
    }
    if(IO_FLAG == 1)
    {
        HEADER("*CONTACT_GUIDED_CABLE_%2s",Type);
        if(Type == "SE")
        {
            ASSIGN(PID_TYP,1);
            HEADER("*CONTACT_GUIDED_CABLE_SET_%2s",Type);
            if(Type == "ID")
            {
                ASSIGN(IdOption,1);
            }
            else
            {
                ASSIGN(IdOption,0);
            }
        }
        else if(Type == "ID")
        {
            ASSIGN(IdOption,1);
            ASSIGN(PID_TYP,0);
        }
        else
        {
            ASSIGN(IdOption,0);
            ASSIGN(PID_TYP,0);
        }
    }

    if(IO_FLAG == 0 && IdOption == 1)
    {
        HEADER("*CONTACT_GUIDED_CABLE%-s",Type);
        //ID Card
        COMMENT("$      CIDHEADING                                                               ");
        CARD("%10d%-70s", _ID_,TITLE);
    }


    if(PID_TYP == 1)
    {
        COMMENT("$     NSID  PSID      SOFT     SSFAC      FRIC");
        CARD("%10d%10d%10lg%10lg%10lg",LSDYNA_NSID,LSDYNA_PSID,LSDYNA_SOFT,LSDYNA_SSFAC,LSDYNA_FRIC);
    }
    else
    {
        COMMENT("$     NSID  PID      SOFT     SSFAC      FRIC");
        CARD("%10d%10d%10lg%10lg%10lg",LSDYNA_NSID,LSDYNA_PID,LSDYNA_SOFT,LSDYNA_SSFAC,LSDYNA_FRIC);
    }
}
