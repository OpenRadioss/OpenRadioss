DEFAULTS(COMMON) {

}

CHECK(COMMON)
{

    LSD_MAT_BETA                              >=0.0;
    LSD_MAT_BETA                              <=1.0;
}

DRAWABLES(COMMON) {
    public:
    MASS_DENSITY=SCALAR(Rho);
    YOUNG_MODULUS=SCALAR(LSD_LCID4);
    POISSON_RATIO=SCALAR(LSD_LCID5);
    //SOUND_SPEED is speed for ISDO = 0 and 1
    SOUND_SPEED  = EVAL((YOUNG_MODULUS/(MASS_DENSITY*(1-POISSON_RATIO*POISSON_RATIO)))^0.5);
    SOUND_SPEED_ISDO_2 = EVAL((YOUNG_MODULUS/MASS_DENSITY)^0.5);
    private:
    G            = EVAL(YOUNG_MODULUS/(2*(1+POISSON_RATIO)));
    C1           = EVAL(YOUNG_MODULUS/(3*(1-2*POISSON_RATIO)));
 public:
  SOUND_SPEED_SOLID = EVAL(((4*G/3+C1)/MASS_DENSITY)^0.5);
}

GUI(COMMON)
{
    RADIO(CommentEnumField)
    {
        ENUM_VALUE_FLAG=TRUE;
        ADD(1,"Hide in Menu/Export");
        ADD(2,"Show in Menu/Export");
        ADD(3,"Do Not Export");
    }
    if(CommentEnumField == 2)
    {
        SIZE(Num_Comments);
        ARRAY(Num_Comments,"")
        {
            SCALAR(Comments);
        }
    }
    if( Mat_Name_OR_LawNo == 1)
    {
        ASSIGN(KEYWORD_STR, "/MAT");
        ASSIGN(KEYWORD_STR, "/COMPUTATIONAL_WELDING_MECHANICS/");
    }
    else
    {
        ASSIGN(KEYWORD_STR, "/MAT");
        ASSIGN(KEYWORD_STR, "/LAW137/");
    }

     FLAG(LSD_TitleOpt);
     if(LSD_TitleOpt == TRUE)
     {
             ASSIGN(KEYWORD_STR, "_TITLE");
     } 
    graphical FLAG(Heat_Inp_opt);
    if (Heat_Inp_opt!= 0)
    {
        SUBOBJECT(SUBGRP_HEAT_MAT) {SUBTYPES = (/SUBOBJECT/HEAT);}
    }  
 mandatory:    
     SCALAR(Rho)                         {DIMENSION="density";}
     DATA(LSD_LCID4);
 optional:
     DATA(LSD_LCID5);
 mandatory:
     DATA(LSD_LCID6);
 optional:     
     DATA(LSD_LCID7);
     DATA(LSD_LCID8);
     SCALAR(LSD_MAT_BETA)                {DIMENSION="k";}
     SCALAR(MATL270_TASTART)             {DIMENSION="k";}
     SCALAR(MATL270_TAEND)               {DIMENSION="k";}
     SCALAR(MATL270_TLSTART)             {DIMENSION="k";}
     SCALAR(MATL270_TLEND)               {DIMENSION="k";}
     SCALAR(MATL270_EGHOST)              {DIMENSION="pressure";}
     SCALAR(MATL270_PGHOST)              {DIMENSION="DIMENSIONLESS";}
     SCALAR(MATL270_AGHOST)              {DIMENSION="DIMENSIONLESS";} 
     SCALAR(EPSINI)                      {DIMENSION="DIMENSIONLESS";}
     SCALAR(TCUTOFF)                     {DIMENSION="k";}
     SCALAR(DTEMP)                       {DIMENSION="k";}
     SCALAR(ANOPT)                       {DIMENSION="DIMENSIONLESS";}
     FLAG(MATL270_OPT_CARD3);
     if(MATL270_OPT_CARD3 == TRUE)
     {
         SCALAR(MATL270_T2PHASE)         {DIMENSION="k";}
         SCALAR(MATL270_T1PHASE)         {DIMENSION="k";}
     }
/*
  graphical SUPPORT("Part(s) to which material is applied") {
    OBJECTS=(/COMPONENT/BRICK,/COMPONENT/TETRA4,/COMPONENT/TETRA10,/COMPONENT/SPHCEL);
    ADD(COMPONENT,"Parts");
  }          
*/
}

DEFAULTS(COMMON)
{
    Mat_Name_OR_LawNo         = 0;
}

FORMAT(radioss2612)
{
    ASSIGN(IO_FLAG, 0, EXPORT);
    ASSIGN(IO_FLAG, 1,IMPORT);
    ASSIGN(FCSYOption,0);
    if(IO_FLAG == 1)
    {
        HEADER("/MAT/31%s",LAW_NO);
        if(LAW_NO == "COMPUTATIONAL_WELDING_MECHANICS" )
        {
            ASSIGN(Mat_Name_OR_LawNo,1);
        }
    }
    else if(IO_FLAG == 0 && Mat_Name_OR_LawNo == 1)
    {
        HEADER("/MAT/COMPUTATIONAL_WELDING_MECHANICS/%d",_ID_);
        CARD("%-100s", TITLE);
    }
    else
    {
        HEADER("/MAT/LAW137/%d",_ID_);
        CARD("%-100s", TITLE);
    }
    COMMENT("#              RHO_I");
    CARD("%20lg",Rho);
    COMMENT("#             FCT_ET             FCT_NUT              FCT_SY              FCT_HR              FCT_AT");
    CARD("%10s%10d%10s%10d%10s%10d%10s%10d%10s%10d",_BLANK_,LSD_LCID4,_BLANK_,LSD_LCID5,_BLANK_,LSD_LCID6,_BLANK_,LSD_LCID7,_BLANK_,LSD_LCID8);
    COMMENT("#               BETA              TASTRT               TAEND              TLSTRT               TLEND");
    CARD("%20lg%20lg%20lg%20lg%20lg",LSD_MAT_BETA,MATL270_TASTART,MATL270_TAEND,MATL270_TLSTART,MATL270_TLEND);
    COMMENT("#             EGHOST             NUGHOST              AGHOST             T1PHASE             T2PHASE");
    CARD("%20lg%20lg%20lg%20lg%20lg",MATL270_EGHOST,MATL270_PGHOST,MATL270_AGHOST,MATL270_T1PHASE,MATL270_T2PHASE);
    COMMENT("#             EPSINI               DTEMP               ANOPT         TEMP_CUTOFF");
    CARD("%20lg%20lg%10s%10d%20lg",EPSINI,DTEMP,_BLANK_,ANOPT,TCUTOFF);
    if(Heat_Inp_opt!=0)
    {
        SUBOBJECTS(SUBGRP_HEAT_MAT,/SUBOBJECT/HEAT,_ID_);
    } 
}

